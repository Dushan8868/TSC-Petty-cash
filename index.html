*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 15% -10%,#1b302b 0%,#12211e 55%,#0d1a17 100%)}

.login-head{padding:30px 32px 22px;border-bottom:1px solid var(--line-2)}
.brandmark{display:flex;align-items:center;gap:11px}

.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}

.nav{padding:12px 10px;flex:1;overflow-y:auto}

.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.sb-user{display:flex;align-items:center;gap:10px;padding:6px 6px}

</head>

/* ---------- Supabase client ---------- */
const CONFIGURED = !CONFIG.SUPABASE_URL.includes('YOUR-PROJECT') && !CONFIG.SUPABASE_ANON_KEY.includes('YOUR-ANON');
let sb = null;
if(CONFIGURED && window.supabase){ sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY); }

/* ---------- State ---------- */
const State = { user:null, view:'dashboard', profiles:[], pcs:[], reimb:[], notif:[], log:[], openId:null, draft:null };

/* ---------- Utils ---------- */
const $ = s=>document.querySelector(s);
const fmt = n => (Number(n)||0).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2});
const aed = n => 'AED '+fmt(n);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const todayISO = () => new Date().toISOString().slice(0,10);
function timeAgo(t){const ts=+new Date(t);const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function dstr(t){return new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function initials(n){return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function avatar(p,size){const s=size||38;const c=(p&&p.color)||'#889';return `<div class="avatar" style="background:${c};width:${s}px;height:${s}px;font-size:${s*0.37}px">${initials(p&&p.name)}</div>`;}
function toast(m,type){const t=document.createElement('div');t.className='toast '+(type||'');t.innerHTML=(type==='ok'?'✓ ':type==='err'?'⚠ ':'')+esc(m);$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2800);}
const profById = id => State.profiles.find(p=>p.id===id) || {name:'—',color:'#889'};
const pcTotal = pc => (pc.bills||[]).reduce((s,b)=>s+(Number(b.amount)||0),0);
const idsByRole = r => State.profiles.filter(p=>p.role===r).map(p=>p.id);
const financeIds = () => idsByRole('finance');

/* ---------- Access helpers ----------
   is_admin (Dushan) is a super-user: can prepare, review, approve and do finance,
   in addition to the admin pages. Everyone else is limited to their own role. */
const isAdmin = () => !!(State.user && State.user.is_admin);
const canEdit    = () => State.user && (State.user.access==='edit' || State.user.is_admin);
const canPrepare = () => (State.user.role==='preparer' || isAdmin()) && canEdit();
const canReviewPc  = pc => (State.user.role==='reviewer' || isAdmin()) && canEdit() && pc.status==='review';
const canApprovePc = pc => (State.user.role==='approver' || isAdmin()) && canEdit() && pc.status==='approve';
const canReimburse = () => (State.user.role==='finance'||State.user.role==='preparer'||isAdmin()) && canEdit();

const STATUS = {draft:{label:'Draft',cls:'draft'},review:{label:'Pending review',cls:'review'},approve:{label:'Pending approval',cls:'approve'},approved:{label:'Approved · for settlement',cls:'done'},rejected:{label:'Returned',cls:'reject'}};
const statusTag = s => { const m=STATUS[s]||STATUS.draft; return `<span class="tag ${m.cls}">${m.label}</span>`; };

/* ==================================================================
   AUTH
   ================================================================== */
window.App = {};
async function initAuth(){
  if(!CONFIGURED || !sb){ showSetupScreen(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); }
  else { $('#login').style.display='flex'; $('#app').style.display='none'; }
  sb.auth.onAuthStateChange((_e,s)=>{ if(!s){ $('#app').style.display='none'; $('#login').style.display='flex'; } });
}
function showSetupScreen(){
  $('#login').style.display='flex';
  $('#loginTitle').textContent='Connect your Supabase project';
  $('#loginMsg').textContent='This app needs a cloud backend before anyone can sign in.';
  $('#loginBody').innerHTML=`<div class="info-line" style="line-height:1.6">
    Open this file and fill the <b>CONFIG</b> block near the top of the script:
    <div style="background:#0d1a17;color:#cfe0d8;padding:12px;border-radius:10px;margin:12px 0;font-family:monospace;font-size:12px;white-space:pre;overflow:auto">SUPABASE_URL: 'https://xxxx.supabase.co'
SUPABASE_ANON_KEY: 'eyJhbGci...'</div>
    Run <b>supabase-setup.sql</b> in the SQL editor, create the six users under
    <b>Authentication &rarr; Users</b>, then host this file. Full steps are in <b>SETUP.md</b>.</div>`;
}
App.signIn = async () => {
  const email=$('#email').value.trim(), password=$('#password').value;
  $('#loginErr').textContent=''; const btn=$('#signinBtn'); btn.disabled=true; btn.textContent='Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled=false; btn.textContent='Sign in';
  if(error){ $('#loginErr').textContent = error.message || 'Sign in failed'; return; }
  await afterLogin();
};
App.signOut = async () => { await sb.auth.signOut(); State.user=null; $('#app').style.display='none'; $('#login').style.display='flex'; $('#password').value=''; };

async function afterLogin(){
  const { data:{ user } } = await sb.auth.getUser();
  let { data:prof } = await sb.from('profiles').select('*').eq('id',user.id).single();
  if(!prof){
    await sb.from('profiles').insert({id:user.id,email:(user.email||'').toLowerCase(),name:(user.email||'user').split('@')[0]});
    ({ data:prof } = await sb.from('profiles').select('*').eq('id',user.id).single());
  }
  State.user = prof;
  $('#login').style.display='none'; $('#app').style.display='block';
  await loadAll(); enterApp(); subscribeRealtime();
}
function enterApp(){ buildNav(); renderSidebarUser(); go(State.view||'dashboard'); window.addEventListener('resize',syncMobile); syncMobile(); refreshBell(); }
function syncMobile(){ $('#menuBtn').style.display = window.innerWidth<=900?'grid':'none'; }

/* ==================================================================
   DATA
   ================================================================== */
async function loadAll(){
  try{
    const [P,PC,B,R,N,L] = await Promise.all([
      sb.from('profiles').select('*'),
      sb.from('petty_cash').select('*').order('created_at',{ascending:false}),
      sb.from('bills').select('*').order('sort'),
      sb.from('reimbursements').select('*').order('received_date',{ascending:false}),
      sb.from('notifications').select('*').eq('recipient',State.user.id).order('created_at',{ascending:false}).limit(200),
      sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(500),
    ]);
    State.profiles = P.data||[];
    const byPc={}; (B.data||[]).forEach(b=>{(byPc[b.petty_cash_id]=byPc[b.petty_cash_id]||[]).push(b);});
    State.pcs = (PC.data||[]).map(p=>({...p, bills:byPc[p.id]||[]}));
    State.reimb = R.data||[]; State.notif = N.data||[]; State.log = L.data||[];
  }catch(e){ console.error(e); toast('Could not load data — check your Supabase setup','err'); }
}
App.reload = async () => { await loadAll(); buildNav(); refreshBell(); go(State.view); toast('Refreshed'); };

async function logAct(action, ref, detail){
  await sb.from('activity_log').insert({actor:State.user.id, action, ref:ref||'', detail:detail||''});
  State.log.unshift({actor:State.user.id, action, ref:ref||'', detail:detail||'', created_at:new Date().toISOString()});
}

function wireDropzone(){const dz=$('#dz');if(!dz)return;['dragover','dragenter'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('drag');}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('drag');}));dz.addEventListener('drop',ev=>{if(ev.dataTransfer.files.length)App.filesPicked(ev.dataTransfer.files);});}

App.filesPicked = async files => {
  for(const f of files){
    const billId = (crypto.randomUUID? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
    const path = `${State.draft.id}/${billId}_${f.name.replace(/[^\w.\-]/g,'_')}`;
    let uploaded=true;
    try{ const {error}=await sb.storage.from(CONFIG.BILLS_BUCKET).upload(path,f,{upsert:true,contentType:f.type}); if(error) throw error; }
    catch(e){ uploaded=false; toast('Upload failed for '+f.name,'err'); }
    const thumbData = f.type.startsWith('image/')? await thumb(f):null;
    // first row for this file
    const rec={id:billId,petty_cash_id:State.draft.id,file_name:f.name,mime:f.type,file_path:uploaded?path:null,bill_date:'',merchant:'',invoice:'',amount:null,gl_code:'',remark:'',is_duplicate:false,sort:(State.draft.bills||[]).length};
    rec._thumb=thumbData; rec._analyzing=true;
    await sb.from('bills').insert(stripUi(rec));
    State.draft.bills.push(rec); drawCreate();
    // read the file — may contain several receipts
    let items=[];
    try{ items = await analyzeExtract(f, rec.mime); }catch(e){ console.warn('analyze',e); }
    if(!items || !items.length){
      // could not read — leave as manual entry
      rec._analyzing=false; if(!rec.bill_date) rec.bill_date=todayISO();
      await checkDuplicate(rec); await sb.from('bills').update(billFields(rec)).eq('id',rec.id); drawCreate(); continue;
    }
    // apply first receipt to the existing row
    applyItem(rec, items[0]); rec._analyzed=true; rec._analyzing=false;
    if(items.length>1) rec.remark = (rec.remark? rec.remark+' · ':'')+'Receipt 1/'+items.length;
    await checkDuplicate(rec); await sb.from('bills').update(billFields(rec)).eq('id',rec.id); drawCreate();
    // extra receipts in the same file → new rows pointing at the same file
    for(let k=1;k<items.length;k++){
      const id2 = (crypto.randomUUID? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
      const r2={id:id2,petty_cash_id:State.draft.id,file_name:f.name,mime:f.type,file_path:rec.file_path,bill_date:'',merchant:'',invoice:'',amount:null,gl_code:'',remark:'Receipt '+(k+1)+'/'+items.length,is_duplicate:false,sort:(State.draft.bills||[]).length,_thumb:thumbData,_analyzed:true};
      applyItem(r2, items[k]);
      await sb.from('bills').insert(stripUi(r2));
      await checkDuplicate(r2); await sb.from('bills').update(billFields(r2)).eq('id',r2.id);
      State.draft.bills.push(r2); drawCreate();
    }
    if(items.length>1) toast(`Read ${items.length} receipts from ${f.name}`,'ok');
  }
};
function stripUi(b){ const {_thumb,_analyzing,_analyzed,...rest}=b; return rest; }
function billFields(b){ return {bill_date:b.bill_date,merchant:b.merchant,invoice:b.invoice,amount:b.amount,remark:b.remark,is_duplicate:b.is_duplicate}; }
function applyItem(rec,it){
  if(it.date&&/^\d{4}-\d{2}-\d{2}$/.test(it.date)) rec.bill_date=it.date; else if(!rec.bill_date) rec.bill_date=todayISO();
  rec.merchant=it.merchant||rec.merchant||'';
  rec.invoice=it.invoice||rec.invoice||'';
  if(it.amount!=null&&!isNaN(it.amount)&&Number(it.amount)>0) rec.amount=Number(it.amount);
}
function thumb(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height;const s=Math.min(1,300/Math.max(w,h));w*=s;h*=s;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',0.7));};i.onerror=()=>res(null);i.src=r.result;};r.onerror=()=>res(null);r.readAsDataURL(f);});}
function toBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}

// Returns an array of receipts found in the file: [{date,merchant,invoice,amount}, ...]
async function analyzeExtract(file, mime){
  const isImg=(mime||'').startsWith('image/'), isPdf=(mime||'').includes('pdf');
  if(!isImg && !isPdf) return [];
  const b64=await toBase64(file);
  const prompt='This file may contain ONE OR MORE separate receipts or invoices — often one per page. Extract EACH receipt/invoice separately. Reply with ONLY a JSON array and nothing else (no markdown): [{"date":"YYYY-MM-DD","merchant":"","invoice":"","amount":0}]. One object per distinct receipt. date = the receipt/invoice date. merchant = the vendor/shop/company name. invoice = the invoice, bill or receipt reference number (empty string if none). amount = the FINAL grand total payable, VAT included, as a plain number only (no currency symbol, no thousands separators). If a value is unreadable use an empty string or 0. Do not invent receipts — only include ones actually present.';
  let text=null;
  if(CONFIG.EDGE_ANALYZE_URL){
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(CONFIG.EDGE_ANALYZE_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+((session&&session.access_token)||'')},body:JSON.stringify({fileBase64:b64,mime})});
    const j=await r.json();
    if(j&&j.error) throw new Error(j.error);
    // edge function may return an array directly, or {items:[...]}, or {text:"..."}
    if(Array.isArray(j)) return normalizeItems(j);
    if(j&&Array.isArray(j.items)) return normalizeItems(j.items);
    if(j&&j.text){ text=j.text; }
    else return normalizeItems([j]);
  } else if(CONFIG.ANTHROPIC_API_KEY){
    const block=isPdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}:{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}};
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':CONFIG.ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:CONFIG.ANTHROPIC_MODEL||'claude-sonnet-4-6',max_tokens:1500,messages:[{role:'user',content:[block,{type:'text',text:prompt}]}]})});
    const d=await r.json();
    if(d&&d.error) throw new Error(d.error.message||'api error');
    text=(d.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
  } else {
    return []; // reader not configured → manual entry
  }
  if(text==null) return [];
  const cleaned=text.replace(/```json|```/g,'').trim();
  let parsed; try{ parsed=JSON.parse(cleaned); }catch(e){ const m=cleaned.match(/\[[\s\S]*\]/); if(m){ try{ parsed=JSON.parse(m[0]); }catch(_){ } } }
  if(!parsed) return [];
  return normalizeItems(Array.isArray(parsed)?parsed:[parsed]);
}
function normalizeItems(arr){
  return (arr||[]).map(x=>({date:x.date||'',merchant:x.merchant||'',invoice:x.invoice||'',amount:(x.amount!=null&&!isNaN(x.amount))?Number(x.amount):null}))
                  .filter(x=>x.merchant||x.amount||x.invoice); // drop empties
}
async function checkDuplicate(rec){
  const key=(inv,amt)=>((inv||'').trim().toLowerCase())+'|'+(Number(amt)||0).toFixed(2);
  if(!rec.invoice){ rec.is_duplicate=false; return; }
  const mine=key(rec.invoice,rec.amount); let dup=false;
  State.pcs.forEach(p=>(p.bills||[]).forEach(o=>{ if(o.id!==rec.id && key(o.invoice,o.amount)===mine) dup=true; }));
  rec.is_duplicate=dup; if(dup) toast('Possible duplicate: '+(rec.file_name||'bill'),'err');
}
App.editBill = async (id,f,v)=>{ const b=State.draft.bills.find(x=>x.id===id); if(!b)return; b[f]=f==='amount'?(v===''?null:Number(v)):v;
  if(f==='invoice'||f==='amount') await checkDuplicate(b);
  await sb.from('bills').update({[f]:b[f],is_duplicate:b.is_duplicate}).eq('id',id); drawCreate(); };
App.removeBill = async id => { const b=State.draft.bills.find(x=>x.id===id); if(b&&b.file_path){ try{await sb.storage.from(CONFIG.BILLS_BUCKET).remove([b.file_path]);}catch(e){} } await sb.from('bills').delete().eq('id',id); State.draft.bills=State.draft.bills.filter(x=>x.id!==id); drawCreate(); };
App.discardDraft = async () => { const d=State.draft; for(const b of (d.bills||[])){ if(b.file_path){try{await sb.storage.from(CONFIG.BILLS_BUCKET).remove([b.file_path]);}catch(e){}} } await sb.from('petty_cash').delete().eq('id',d.id); State.pcs=State.pcs.filter(p=>p.id!==d.id); State.draft=null; toast('Draft discarded'); go('list'); };
App.finalise = async () => {
  const d=State.draft; const noGl=(d.bills||[]).filter(b=>!b.gl_code).length, noAmt=(d.bills||[]).filter(b=>!b.amount).length;
  if(noGl){toast(`${noGl} bill(s) have no GL account`,'err');return;} if(noAmt){toast(`${noAmt} bill(s) have no amount`,'err');return;}
  const dup=(d.bills||[]).filter(b=>b.is_duplicate).length;
  const resubmit = !!d.ref;   // already has a reference → this is a corrected re-submission
  const run=async()=>{
    let ref=d.ref;
    if(!resubmit){ const {data}=await sb.rpc('assign_ref',{pc:d.id}); ref=data; }
    // back to review; clear any previous return so the trail is clean
    await sb.from('petty_cash').update({status:'review',finalised_at:new Date().toISOString(),ref,reject_reason:null,rejected_by:null,rejected_at:null}).eq('id',d.id);
    d.ref=ref; d.status='review'; d.finalised_at=new Date().toISOString(); d.reject_reason=null; d.rejected_by=null;
    await logAct(resubmit?'Re-submitted after correction':'Finalised petty cash',ref,`${d.bills.length} bill(s) · ${aed(pcTotal(d))}`);
    await notify(idsByRole('reviewer'),`${State.user.name} ${resubmit?'re-submitted corrected':'finalised'} petty cash ${ref} (${aed(pcTotal(d))}). Ready for your check & review.`,d.id,ref);
    State.draft=null; closeModal(); toast(resubmit?'Re-submitted — Benin notified':'Finalised — Benin notified','ok'); await loadAll(); buildNav(); go('list');
  };
  if(dup) confirmModal('Duplicates present',`${dup} possible duplicate bill(s) are still flagged. Finalise anyway?`,'Finalise anyway',run); else run();
};

function stepperHTML(pc){
  const rej=pc.status==='rejected';
  const steps=[{t:'Prepared',u:pc.created_by,done:true},{t:'Check & review',u:pc.reviewed_by||idsByRole('reviewer')[0],done:['approve','approved'].includes(pc.status),active:pc.status==='review'},{t:'Final approval',u:pc.approved_by||idsByRole('approver')[0],done:pc.status==='approved',active:pc.status==='approve'},{t:'Finance settlement',u:null,done:pc.status==='approved'}];
  return `<div class="stepper">${steps.map((s,i)=>{let cls=s.done?'done':(s.active?'active':'');if(rej&&((i===1&&!pc.reviewed_by)||(i===2&&pc.reviewed_by)))cls='reject';const p=s.u?profById(s.u):null;return `<div class="step ${cls}"><div class="node"><div class="circle">${s.done?'✓':(i+1)}</div><div class="who"><b>${s.t}</b><span>${p?esc(p.name):'Dushan · Alkhudary · Jafer'}</span></div></div><div class="bar"></div></div>`;}).join('')}</div>`;
}

  <div class="grid" style="grid-template-columns:1fr 300px">
    <div class="card"><div class="hd"><h3>Bills & invoices</h3><div class="spacer"></div><span class="sub">${(pc.bills||[]).length} lines</span></div>
      <div class="bd" style="padding:0"><table><thead><tr><th></th><th>Date</th><th>Merchant</th><th>Invoice</th><th>GL / Reason</th><th class="right">Amount</th></tr></thead><tbody>
      ${(pc.bills||[]).map(b=>{const g=glByCode(b.gl_code);return `<tr><td style="width:40px">${b.file_path?`<button class="chip" style="padding:2px 8px;font-size:10px;cursor:pointer" onclick="App.viewBill('${b.id}')">${(b.mime||'').includes('pdf')?'PDF':'IMG'}</button>`:'—'}</td><td class="num">${esc(b.bill_date||'—')} ${b.is_duplicate?'<span class="tag dup" style="margin-left:4px">dup</span>':''}</td><td>${esc(b.merchant||'—')}</td><td class="sub">${esc(b.invoice||'—')}</td><td><div style="font-size:12.5px">${g?esc(g.name):'—'}</div>${g?`<div class="sub num" style="font-size:11px">${g.code} · ${g.cat}</div>`:''}${b.remark?`<div class="sub" style="font-size:11px;font-style:italic">“${esc(b.remark)}”</div>`:''}</td><td class="right num" style="font-weight:600">${aed(b.amount)}</td></tr>`;}).join('')}

    <div class="grid" style="align-content:start">
      <div class="card"><div class="hd"><h3>Approval trail</h3></div><div class="bd">
        ${trailRow('Prepared by',profById(pc.created_by),pc.finalised_at||pc.created_at)}

      ${(rv||ap)?`<div class="card"><div class="hd"><h3>Your action</h3></div><div class="bd"><div class="info-line" style="margin-bottom:12px">${rv?'Confirm the bills, reasons and GL accounts are correct.':'Give final approval to raise this to Finance for settlement.'}</div><button class="btn primary block" onclick="App.approve('${pc.id}')">${rv?'Approve & forward to Shadi':'Give final approval'}</button><button class="btn danger block" style="margin-top:9px" onclick="App.reject('${pc.id}')">Return to preparer</button></div></div>`:''}
      ${owner?`<div class="card"><div class="bd"><button class="btn primary block" onclick="App.resume('${pc.id}')">Continue editing draft</button></div></div>`:''}
      ${canFix?`<div class="card"><div class="hd"><h3>Correct & re-submit</h3></div><div class="bd"><div class="info-line" style="margin-bottom:12px">This petty cash was returned. Fix the bills, amounts or GL accounts, then re-submit — it keeps the same reference ${esc(pc.ref||'')} and goes back for review.</div><button class="btn primary block" onclick="App.resume('${pc.id}')">Open to correct</button></div></div>`:''}
      ${isAdmin()?`<div class="card"><div class="hd"><h3>Admin</h3></div><div class="bd"><button class="btn danger block" onclick="App.adminDelete('${pc.id}')">Delete this petty cash</button></div></div>`:''}
    </div>
  </div>`;
}
function trailRow(label,p,ts){ if(p==='pending')return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0"><div class="avatar" style="background:#e7ebe6;color:#9aa79f;width:32px;height:32px;font-size:12px">…</div><div><b style="font-size:12.5px">${label}</b><div class="sub" style="font-size:11.5px">Pending</div></div></div>`; return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0">${avatar(p,32)}<div><b style="font-size:12.5px">${esc(p.name)}</b><div class="sub" style="font-size:11.5px">${label}${ts?' · '+dstr(ts):''}</div></div></div>`; }
App.viewBill = async bid => {
  let b=null; State.pcs.forEach(p=>(p.bills||[]).forEach(x=>{if(x.id===bid)b=x;}));
  if(!b||!b.file_path){toast('No file');return;}
  const {data,error}=await sb.storage.from(CONFIG.BILLS_BUCKET).createSignedUrl(b.file_path,3600);
  if(error){toast('Could not open file','err');return;}
  $('#modalTitle').textContent=b.file_name||'Bill';
  $('#modalBody').innerHTML=(b.mime||'').includes('pdf')?`<iframe src="${data.signedUrl}" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:10px"></iframe>`:`<img src="${data.signedUrl}" style="width:100%;border-radius:10px">`;
  $('#modalFoot').innerHTML=`<a class="btn" href="${data.signedUrl}" target="_blank">Open in new tab</a><button class="btn" onclick="App.closeModal()">Close</button>`;
  $('#modalWrap').classList.add('show');
};
App.resume = id => { State.draft=State.pcs.find(p=>p.id===id); go('create'); };
App.approve = async id => {
  const pc=State.pcs.find(p=>p.id===id);
  // Decide the action by the petty cash's current stage — so an admin (super-user)
  // acting on either stage does the correct step.
  if(pc.status==='review' && canReviewPc(pc)){
    await sb.from('petty_cash').update({status:'approve',reviewed_by:State.user.id,reviewed_at:new Date().toISOString()}).eq('id',id);
    await logAct('Reviewed & approved',pc.ref);
    await notify(idsByRole('approver'),`${State.user.name} approved petty cash ${pc.ref} (${aed(pcTotal(pc))}), prepared by ${profById(pc.created_by).name}. Awaiting final approval.`,pc.id,pc.ref);
    toast('Approved — forwarded for final approval','ok');
  } else if(pc.status==='approve' && canApprovePc(pc)){
    await sb.from('petty_cash').update({status:'approved',approved_by:State.user.id,approved_at:new Date().toISOString()}).eq('id',id);
    await logAct('Final approval',pc.ref,aed(pcTotal(pc)));
    await notify(financeIds(),`Approved petty cash ${pc.ref} (${aed(pcTotal(pc))}) has been raised from TSC FM for settlement. Prepared by ${profById(pc.created_by).name}, reviewed by ${profById(pc.reviewed_by).name}, approved by ${State.user.name}.`,pc.id,pc.ref);
    toast('Final approval given — Finance notified','ok');
  } else { toast('You cannot act on this petty cash at its current stage','err'); return; }
  await loadAll(); buildNav(); renderDetail(id);
};
App.reject = id => { promptModal('Return to preparer','Reason for returning this petty cash','e.g. Bill on line 3 missing / wrong GL', async reason=>{ if(!reason)return; const pc=State.pcs.find(p=>p.id===id);
  await sb.from('petty_cash').update({status:'rejected',rejected_by:State.user.id,rejected_at:new Date().toISOString(),reject_reason:reason}).eq('id',id);
  await logAct('Returned petty cash',pc.ref,reason);
  await notify([pc.created_by],`${State.user.name} returned petty cash ${pc.ref}: “${reason}”. Please correct and re-submit.`,pc.id,pc.ref);
  toast('Returned to preparer'); await loadAll(); buildNav(); renderDetail(id); }); };

function renderUsers(){
  if(!isAdmin()){ $('#view').innerHTML=`<div class="empty"><div class="big">Admin access required</div>Only admins can manage rights.</div>`; return; }
  $('#view').innerHTML=`<div class="warn-banner">Set each person's access level. <b>Read only</b> can view everything but cannot create, edit or approve. <b>Read & edit</b> can act on their role. Changes apply immediately (they may need to refresh).</div>
  <div class="card"><div class="hd"><h3>Users</h3><div class="spacer"></div><span class="sub">${State.profiles.length} accounts</span></div>
  <div class="bd" style="padding:0"><table><thead><tr><th>User</th><th>Role</th><th>Access level</th><th>Admin</th></tr></thead><tbody>
    ${State.profiles.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<tr>
      <td><div style="display:flex;align-items:center;gap:10px">${avatar(p,32)}<div><b>${esc(p.name)}</b><div class="sub" style="font-size:11.5px">${esc(p.email)}</div></div></div></td>
      <td><select class="input" style="padding:6px 9px;min-width:130px" onchange="App.setUser('${p.id}','role',this.value)">${['preparer','reviewer','approver','finance'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${roleLabel(r)}</option>`).join('')}</select></td>
      <td><div class="seg"><button class="${p.access==='read'?'on':''}" onclick="App.setUser('${p.id}','access','read')">Read only</button><button class="${p.access==='edit'?'on':''}" onclick="App.setUser('${p.id}','access','edit')">Read & edit</button></div></td>
      <td><input type="checkbox" ${p.is_admin?'checked':''} onchange="App.setUser('${p.id}','is_admin',this.checked)" style="width:18px;height:18px"></td>
    </tr>`).join('')}
  </tbody></table></div></div>`;
}
App.setUser = async (id,field,value) => {
  const {error}=await sb.from('profiles').update({[field]:value}).eq('id',id);
  if(error){toast('Update failed — '+error.message,'err');return;}
  const p=State.profiles.find(x=>x.id===id); if(p)p[field]=value;
  if(id===State.user.id){ State.user[field]=value; renderSidebarUser(); buildNav(); }
  await logAct('Changed user rights', '', `${profById(id).name}: ${field} → ${value}`);
  toast('Updated','ok'); renderUsers();
};

/* ==================================================================
   DATA CONTROLS (admin)
   ================================================================== */
function renderAdmin(){
  if(!isAdmin()){ $('#view').innerHTML=`<div class="empty"><div class="big">Admin access required</div></div>`; return; }
  $('#view').innerHTML=`<div class="warn-banner">Admin actions are irreversible and are written to the activity log.</div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><div class="hd"><h3>Petty cash records</h3></div><div class="bd" style="padding:0">${State.pcs.length?`<table><thead><tr><th>Reference</th><th>Status</th><th class="right">Total</th><th></th></tr></thead><tbody>${State.pcs.map(p=>`<tr><td><b>${esc(p.ref||'(draft)')}</b></td><td>${statusTag(p.status)}</td><td class="right num">${aed(pcTotal(p))}</td><td class="right"><button class="btn ghost sm" onclick="App.open('${p.id}')">Open</button><button class="btn ghost sm danger" onclick="App.adminDelete('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty" style="padding:26px">No records</div>`}</div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="hd"><h3>Backup</h3></div><div class="bd"><p class="info-line" style="margin-top:0">Download a full copy of all data (petty cash, bills, reimbursements, log) as a JSON file, or export every bill as a CSV.</p><button class="btn primary block" onclick="App.backupJSON()">Download full backup (JSON)</button><button class="btn block" style="margin-top:9px" onclick="App.exportBillsCSV()">Export all bills (CSV)</button></div></div>
      <div class="card"><div class="hd"><h3>Bulk data</h3></div><div class="bd"><p class="info-line" style="margin-top:0">Remove all petty cash, bills, reimbursements, notifications and the activity log. Users and the chart of accounts are kept.</p><button class="btn danger block" onclick="App.clearAll()">Clear all data</button></div></div>
      <div class="card"><div class="hd"><h3>Cloud</h3></div><div class="bd"><p class="info-line" style="margin:0">Backend: <b>Supabase</b> · shared across all users. Petty cash ${State.pcs.length} · Reimbursements ${State.reimb.length} · Log ${State.log.length}.</p></div></div>
    </div></div>`;
}
App.adminDelete = id => { const pc=State.pcs.find(p=>p.id===id); if(!pc)return; confirmModal('Delete petty cash',`Permanently delete <b>${esc(pc.ref||'this draft')}</b> and its ${(pc.bills||[]).length} bill(s)?`,'Delete', async ()=>{ for(const b of (pc.bills||[])){ if(b.file_path){try{await sb.storage.from(CONFIG.BILLS_BUCKET).remove([b.file_path]);}catch(e){}} } await sb.from('petty_cash').delete().eq('id',id); State.pcs=State.pcs.filter(p=>p.id!==id); await logAct('Deleted petty cash',pc.ref||''); closeModal(); toast('Deleted'); go(State.view==='admin'?'admin':'list'); }); };
App.clearAll = () => { confirmModal('Clear all data','This removes every petty cash, bill, reimbursement, notification and log entry across the cloud. It cannot be undone.','Clear everything', async ()=>{
  await sb.from('bills').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await sb.from('petty_cash').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await sb.from('reimbursements').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await sb.from('notifications').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await sb.from('activity_log').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await loadAll(); closeModal(); toast('All data cleared'); go('dashboard'); buildNav(); refreshBell(); }); };

/* ==================================================================
   NOTIFICATIONS + MODALS
   ================================================================== */
const unreadCount = () => State.notif.filter(n=>!n.is_read).length;
function refreshBell(){ $('#bellDot').style.display=unreadCount()?'block':'none'; }
App.toggleNotif = () => { const p=$('#notifPanel'),o=p.classList.toggle('open'); $('#overlay').classList.toggle('show',o); if(o)renderNotifs(); };
App.closePanels = () => { $('#notifPanel').classList.remove('open'); $('#overlay').classList.remove('show'); };
function renderNotifs(){ $('#notifList').innerHTML=State.notif.length?State.notif.map(n=>`<div class="notif ${n.is_read?'':'unread'}"><div class="nm">${esc(n.message)}</div><div class="nt"><span>${timeAgo(n.created_at)}</span>${n.petty_cash_id?`<button class="btn ghost sm" style="margin-left:auto;padding:3px 9px" onclick="App.openFromNotif('${n.id}','${n.petty_cash_id}')">Open</button>`:''}</div></div>`).join(''):`<div class="empty"><div class="big">No notifications</div>You're all caught up.</div>`; }
App.openFromNotif = async (nid,pcId) => { const n=State.notif.find(x=>x.id===nid); if(n&&!n.is_read){ n.is_read=true; await sb.from('notifications').update({is_read:true}).eq('id',nid); refreshBell(); } App.closePanels(); App.open(pcId); };
App.markAllRead = async () => { const ids=State.notif.filter(n=>!n.is_read).map(n=>n.id); if(ids.length) await sb.from('notifications').update({is_read:true}).in('id',ids); State.notif.forEach(n=>n.is_read=true); refreshBell(); renderNotifs(); };
function closeModal(){ $('#modalWrap').classList.remove('show'); } App.closeModal=closeModal;
function confirmModal(title,html,ok,onOk){ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=`<p style="margin:0;line-height:1.55">${html}</p>`; $('#modalFoot').innerHTML=`<button class="btn" onclick="App.closeModal()">Cancel</button><button class="btn danger" id="okBtn">${esc(ok)}</button>`; $('#modalWrap').classList.add('show'); $('#okBtn').onclick=onOk; }
function promptModal(title,label,ph,onOk){ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=`<div class="field" style="margin:0"><label>${esc(label)}</label><textarea id="pmInp" class="input" placeholder="${esc(ph)}"></textarea></div>`; $('#modalFoot').innerHTML=`<button class="btn" onclick="App.closeModal()">Cancel</button><button class="btn primary" id="pmOk">Submit</button>`; $('#modalWrap').classList.add('show'); $('#pmOk').onclick=()=>{const v=$('#pmInp').value.trim();closeModal();onOk(v);}; }


/* ================= REPORTS · SUMMARY · PRINT · BACKUP ================= */
function firstOfMonth(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10); }
function glTotalsFrom(bills){
  const m={}; bills.forEach(b=>{ if(!b.gl_code)return; m[b.gl_code]=(m[b.gl_code]||0)+(Number(b.amount)||0); });
  return Object.entries(m).map(([code,amt])=>({code,name:(glByCode(code)||{}).name||code,cat:(glByCode(code)||{}).cat||'',amt})).sort((a,b)=>b.amt-a.amt);
}
function printHTML(title, inner){
  const w=window.open('','_blank');
  if(!w){ toast('Allow pop-ups to print','err'); return; }
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+title+'</title><style>'
    +'*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#1a2420;margin:24px;font-size:12px}'
    +'.rpt-head{display:flex;align-items:center;gap:16px;border-bottom:2px solid #1e6b4f;padding-bottom:12px;margin-bottom:16px}'
    +'.rpt-head img{height:46px}.rpt-head h1{font-size:17px;margin:0}.rpt-head .meta{margin-left:auto;text-align:right;font-size:11px;color:#555}'
    +'table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #cfd6cf;padding:6px 8px;font-size:11px}'
    +'th{background:#e4f0ea;text-align:left}td.r,th.r{text-align:right}tfoot td{font-weight:bold;background:#f4f6f3}'
    +'h2{font-size:13px;margin:18px 0 6px;color:#134634}.sign{display:flex;gap:20px;margin-top:40px;flex-wrap:wrap}'
    +'.sign div{flex:1;min-width:150px;border-top:1px solid #333;padding-top:6px;font-size:11px}.sign b{display:block}'
    +'.noprint{margin:0 0 14px}@media print{.noprint{display:none}}'
    +'</style></head><body>'
    +'<div class="noprint"><button onclick="window.print()" style="padding:8px 16px;font-size:13px;background:#1e6b4f;color:#fff;border:none;border-radius:6px;cursor:pointer">Print / Save as PDF</button></div>'
    +inner+'</body></html>');
  w.document.close();
}
function formBody(opts){
  const bills=opts.bills||[];
  const rows=bills.map((b,i)=>'<tr><td class="r">'+(i+1)+'</td><td>'+esc(b.bill_date||'')+'</td><td>'+esc(b.invoice||'')+'</td><td>'+esc(b.remark||'')+'</td><td>'+esc(b.merchant||'')+'</td><td>'+esc((glByCode(b.gl_code)||{}).name||'')+'</td><td class="r">'+fmt(b.amount)+'</td></tr>').join('');
  const grand=bills.reduce((s,b)=>s+(Number(b.amount)||0),0);
  const gl=glTotalsFrom(bills);
  const glRows=gl.map(g=>'<tr><td>'+esc(g.code)+'</td><td>'+esc(g.name)+'</td><td class="r">'+fmt(g.amt)+'</td></tr>').join('');
  return ''
   +'<div class="rpt-head"><img src="'+LOGO+'"><div><h1>Petty Cash Reimbursement</h1>'
   +'<div style="font-size:11px;color:#555">'+esc(opts.title||'Facilities Management Operations')+'</div></div>'
   +'<div class="meta">Ref No: <b>'+esc(opts.refNo||'')+'</b><br>Date: '+esc(opts.dateStr||todayISO())+'<br>To: Accounts Department</div></div>'
   +'<table><thead><tr><th class="r">SR</th><th>Date</th><th>Receipt No</th><th>Particulars</th><th>Suppliers Name</th><th>Allocation (GL)</th><th class="r">Total Amount</th></tr></thead>'
   +'<tbody>'+(rows||'<tr><td colspan="7" style="text-align:center;color:#999">No bills</td></tr>')+'</tbody>'
   +'<tfoot><tr><td colspan="6" class="r">Grand Total (AED)</td><td class="r">'+fmt(grand)+'</td></tr></tfoot></table>'
   +'<h2>Allocation summary — by GL account</h2>'
   +'<table><thead><tr><th>GL code</th><th>Account</th><th class="r">Total (AED)</th></tr></thead><tbody>'+glRows+'</tbody>'
   +'<tfoot><tr><td colspan="2" class="r">Total</td><td class="r">'+fmt(grand)+'</td></tr></tfoot></table>'
   +'<div class="sign">'
   +'<div><b>Prepared by</b>'+esc(opts.prepared||'Ahmad Abu Taha')+'<br>Accountant</div>'
   +'<div><b>Verified by</b>'+esc(opts.reviewed||'Benin Rajappan')+'<br>Facilities Engineer</div>'
   +'<div><b>Approved by</b>'+esc(opts.approved||'Shadi Girgis')+'<br>Facility Manager</div>'
   +'<div><b>Verified by</b>Waqar Khan<br>Senior Accountant</div></div>';
}
App.printSummary = id => { const pc=State.pcs.find(p=>p.id===id); if(!pc)return;
  const inner=formBody({title:'Community Management',refNo:pc.ref||'',dateStr:todayISO(),bills:pc.bills||[],
    prepared:profById(pc.created_by).name, reviewed:pc.reviewed_by?profById(pc.reviewed_by).name:'', approved:pc.approved_by?profById(pc.approved_by).name:''});
  printHTML('Petty Cash '+(pc.ref||''), inner);
};

/* ---- Reports view ---- */
function reportRange(){ return {from:($('#rpFrom')||{}).value||'', to:($('#rpTo')||{}).value||''}; }
function reportBills(){ const {from,to}=reportRange(); const out=[];
  State.pcs.filter(p=>p.status==='approved').forEach(p=>(p.bills||[]).forEach(b=>{ const d=b.bill_date||'';
    if((from||to)&&!d) return; if(from&&d<from)return; if(to&&d>to)return; out.push(b); })); return out; }
function renderReports(){
  if(!(isAdmin()||State.user.role==='finance')){ $('#view').innerHTML='<div class="empty"><div class="big">Reports are for Finance & Admin</div></div>'; return; }
  $('#view').innerHTML=''
   +'<div class="card"><div class="bd"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">'
   +'<div class="field" style="margin:0"><label>Period</label><select id="rpPreset" class="input" onchange="App.reportPreset()">'
   +'<option value="month">This month</option><option value="lastmonth">Last month</option><option value="year">This year</option><option value="all">All time</option><option value="custom">Custom range</option></select></div>'
   +'<div class="field" style="margin:0"><label>From</label><input id="rpFrom" type="date" class="input" value="'+firstOfMonth()+'"></div>'
   +'<div class="field" style="margin:0"><label>To</label><input id="rpTo" type="date" class="input" value="'+todayISO()+'"></div>'
   +'<button class="btn primary" onclick="App.reportRun()">Run report</button><div class="spacer"></div>'
   +'<button class="btn" onclick="App.reportPrintForm()">Print claim form</button>'
   +'<button class="btn" onclick="App.exportBillsCSV()">Export CSV</button></div></div></div>'
   +'<div id="rpOut"></div>';
  App.reportRun();
}
App.reportPreset = () => { const v=$('#rpPreset').value, now=new Date(); let f,t=todayISO();
  if(v==='month') f=firstOfMonth();
  else if(v==='lastmonth'){ f=new Date(now.getFullYear(),now.getMonth()-1,1).toISOString().slice(0,10); t=new Date(now.getFullYear(),now.getMonth(),0).toISOString().slice(0,10); }
  else if(v==='year') f=new Date(now.getFullYear(),0,1).toISOString().slice(0,10);
  else if(v==='all'){ f=''; t=''; }
  else return;
  $('#rpFrom').value=f; $('#rpTo').value=t; App.reportRun();
};
App.reportRun = () => {
  const bills=reportBills(); const total=bills.reduce((s,b)=>s+(Number(b.amount)||0),0);
  const gl=glTotalsFrom(bills), glMax=Math.max(1,...gl.map(g=>g.amt));
  const mm={}; bills.forEach(b=>{const k=(b.merchant||'—').trim()||'—'; mm[k]=mm[k]||{m:k,amt:0,cnt:0}; mm[k].amt+=Number(b.amount)||0; mm[k].cnt++;});
  const merch=Object.values(mm).sort((a,b)=>b.amt-a.amt);
  const {from,to}=reportRange();
  const pcs=State.pcs.filter(p=>p.status==='approved'&&(p.bills||[]).some(b=>{const d=b.bill_date||''; if((from||to)&&!d)return false; if(from&&d<from)return false; if(to&&d>to)return false; return true;}));
  $('#rpOut').innerHTML=''
   +'<div class="kpis" style="grid-template-columns:repeat(3,1fr)">'
   +'<div class="kpi"><span class="strip" style="background:var(--brand)"></span><div class="lbl">Total spend (period)</div><div class="val num">'+aed(total)+'</div><div class="foot">'+bills.length+' transactions</div></div>'
   +'<div class="kpi"><span class="strip" style="background:var(--blue)"></span><div class="lbl">GL accounts used</div><div class="val num">'+gl.length+'</div></div>'
   +'<div class="kpi"><span class="strip" style="background:var(--amber)"></span><div class="lbl">Merchants</div><div class="val num">'+merch.length+'</div></div></div>'
   +'<div class="grid" style="grid-template-columns:1fr 1fr">'
   +'<div class="card"><div class="hd"><h3>GL account totals (allocation)</h3></div><div class="bd">'
   +(gl.length?gl.map(g=>'<div style="margin-bottom:10px"><div style="display:flex;gap:8px;align-items:baseline"><span style="font-weight:600;font-size:12.5px">'+esc(g.name)+'</span><span class="chip" style="padding:1px 6px;font-size:10px">'+g.code+'</span><div class="spacer"></div><span class="num" style="font-weight:700">'+aed(g.amt)+'</span></div><div class="bar-track"><div class="bar-fill" style="width:'+(g.amt/glMax*100).toFixed(1)+'%"></div></div></div>').join(''):'<div class="empty">No data in this period</div>')
   +'</div></div>'
   +'<div class="card"><div class="hd"><h3>Merchants & purchases</h3></div><div class="bd" style="padding:0">'
   +(merch.length?'<table><thead><tr><th>Merchant</th><th class="right">Count</th><th class="right">Total</th></tr></thead><tbody>'+merch.map(x=>'<tr><td>'+esc(x.m)+'</td><td class="right num">'+x.cnt+'</td><td class="right num" style="font-weight:600">'+aed(x.amt)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">No data</div>')
   +'</div></div></div>'
   +'<div class="card" style="margin-top:16px"><div class="hd"><h3>Petty cash in this period</h3></div><div class="bd" style="padding:0">'+(pcs.length?pcTable(pcs):'<div class="empty">No approved petty cash in this period</div>')+'</div></div>';
};
App.reportPrintForm = () => {
  const bills=reportBills(), {from,to}=reportRange();
  const pv=idsByRole('preparer')[0], rv=idsByRole('reviewer')[0], ap=idsByRole('approver')[0];
  const inner=formBody({title:'Community Management',refNo:'',dateStr:todayISO(),bills,
    prepared:pv?profById(pv).name:'Ahmad Abu Taha', reviewed:rv?profById(rv).name:'Benin Rajappan', approved:ap?profById(ap).name:'Shadi Girgis'});
  printHTML('Petty Cash Claim '+(from||'start')+' to '+(to||'all'), inner);
};

/* ---- Backup ---- */
function downloadFile(name,content,type){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
App.backupJSON = async () => {
  const data={ exported:new Date().toISOString(),
    profiles:State.profiles.map(p=>({id:p.id,email:p.email,name:p.name,role:p.role,access:p.access,is_admin:p.is_admin})),
    petty_cash:State.pcs.map(p=>{const {bills,...rest}=p; return rest;}),
    bills:State.pcs.flatMap(p=>(p.bills||[]).map(stripUi)),
    reimbursements:State.reimb, activity_log:State.log };
  downloadFile('pettycash-backup-'+todayISO()+'.json', JSON.stringify(data,null,2), 'application/json');
  try{ await logAct('Exported backup',''); }catch(e){}
  toast('Backup downloaded','ok');
};
App.exportBillsCSV = () => {
  const rows=[['Reference','Status','Bill date','Merchant','Invoice','GL code','GL name','Amount','Remark']];
  State.pcs.forEach(p=>(p.bills||[]).forEach(b=>rows.push([p.ref||'',p.status,b.bill_date||'',b.merchant||'',b.invoice||'',b.gl_code||'',(glByCode(b.gl_code)||{}).name||'',b.amount!=null?b.amount:'',b.remark||''])));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  downloadFile('bills-'+todayISO()+'.csv', csv, 'text/csv');
  toast('CSV downloaded','ok');
};

/* ---------- start ---------- */
initAuth();
</script>
