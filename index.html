<style>

*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}

button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--teal);text-decoration:none}

.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 15px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.12s;white-space:nowrap}

.btn.danger{color:var(--red);border-color:#e6cfcd}.btn.danger:hover{background:var(--red-bg)}

.btn.block{width:100%;justify-content:center}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 15% -10%,#1b302b 0%,#12211e 55%,#0d1a17 100%)}
.login-card{width:100%;max-width:430px;background:var(--card);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.login-head{padding:30px 32px 22px;border-bottom:1px solid var(--line-2)}
.brandmark{display:flex;align-items:center;gap:11px}

.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:#cfe0d8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-brand{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand .brandmark .txt b{color:#fff}.sb-brand .brandmark .txt span{color:#8ba79a}.sb-brand .logo{width:36px;height:36px;font-size:15px}
.nav{padding:12px 10px;flex:1;overflow-y:auto}

.nav a .ico{width:18px;height:18px;flex:none;opacity:.9}
.nav a .badge{margin-left:auto;background:var(--amber);color:#1a1205;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}

.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.sb-user{display:flex;align-items:center;gap:10px;padding:6px 6px}

.topbar h2{margin:0;font-size:17px;letter-spacing:-.02em}.topbar .sub{color:var(--muted);font-size:12.5px}

.input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}

</head>

const State = { user:null, view:'dashboard', profiles:[], pcs:[], reimb:[], notif:[], log:[], openId:null, draft:null };

/* ---------- Utils ---------- */
const $ = s=>document.querySelector(s);
const fmt = n => (Number(n)||0).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2});
const aed = n => 'AED '+fmt(n);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const todayISO = () => new Date().toISOString().slice(0,10);
function timeAgo(t){const ts=+new Date(t);const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function dstr(t){return new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function initials(n){return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function avatar(p,size){const s=size||38;const c=(p&&p.color)||'#889';return `<div class="avatar" style="background:${c};width:${s}px;height:${s}px;font-size:${s*0.37}px">${initials(p&&p.name)}</div>`;}
function toast(m,type){const t=document.createElement('div');t.className='toast '+(type||'');t.innerHTML=(type==='ok'?'✓ ':type==='err'?'⚠ ':'')+esc(m);$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2800);}
const profById = id => State.profiles.find(p=>p.id===id) || {name:'—',color:'#889'};
const pcTotal = pc => (pc.bills||[]).reduce((s,b)=>s+(Number(b.amount)||0),0);
const idsByRole = r => State.profiles.filter(p=>p.role===r).map(p=>p.id);
const financeIds = () => idsByRole('finance');

/* ---------- Access helpers ---------- */
const canEdit    = () => State.user && (State.user.access==='edit' || State.user.is_admin);
const canPrepare = () => State.user.role==='preparer' && canEdit();
const canReviewPc  = pc => State.user.role==='reviewer' && canEdit() && pc.status==='review';
const canApprovePc = pc => State.user.role==='approver' && canEdit() && pc.status==='approve';
const canReimburse = () => (State.user.role==='finance'||State.user.role==='preparer') && canEdit();
const isAdmin = () => !!State.user.is_admin;

const STATUS = {draft:{label:'Draft',cls:'draft'},review:{label:'Pending review',cls:'review'},approve:{label:'Pending approval',cls:'approve'},approved:{label:'Approved · for settlement',cls:'done'},rejected:{label:'Returned',cls:'reject'}};
const statusTag = s => { const m=STATUS[s]||STATUS.draft; return `<span class="tag ${m.cls}">${m.label}</span>`; };

/* ==================================================================
   AUTH
   ================================================================== */
window.App = {};
async function initAuth(){
  if(!CONFIGURED || !sb){ showSetupScreen(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); }
  else { $('#login').style.display='flex'; $('#app').style.display='none'; }
  sb.auth.onAuthStateChange((_e,s)=>{ if(!s){ $('#app').style.display='none'; $('#login').style.display='flex'; } });
}
function showSetupScreen(){
  $('#login').style.display='flex';
  $('#loginTitle').textContent='Connect your Supabase project';
  $('#loginMsg').textContent='This app needs a cloud backend before anyone can sign in.';
  $('#loginBody').innerHTML=`<div class="info-line" style="line-height:1.6">
    Open this file and fill the <b>CONFIG</b> block near the top of the script:
    <div style="background:#0d1a17;color:#cfe0d8;padding:12px;border-radius:10px;margin:12px 0;font-family:monospace;font-size:12px;white-space:pre;overflow:auto">SUPABASE_URL: 'https://xxxx.supabase.co'
SUPABASE_ANON_KEY: 'eyJhbGci...'</div>
    Run <b>supabase-setup.sql</b> in the SQL editor, create the six users under
    <b>Authentication &rarr; Users</b>, then host this file. Full steps are in <b>SETUP.md</b>.</div>`;
}
App.signIn = async () => {
  const email=$('#email').value.trim(), password=$('#password').value;
  $('#loginErr').textContent=''; const btn=$('#signinBtn'); btn.disabled=true; btn.textContent='Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled=false; btn.textContent='Sign in';
  if(error){ $('#loginErr').textContent = error.message || 'Sign in failed'; return; }
  await afterLogin();
};
App.signOut = async () => { await sb.auth.signOut(); State.user=null; $('#app').style.display='none'; $('#login').style.display='flex'; $('#password').value=''; };

async function afterLogin(){
  const { data:{ user } } = await sb.auth.getUser();
  let { data:prof } = await sb.from('profiles').select('*').eq('id',user.id).single();
  if(!prof){
    await sb.from('profiles').insert({id:user.id,email:(user.email||'').toLowerCase(),name:(user.email||'user').split('@')[0]});
    ({ data:prof } = await sb.from('profiles').select('*').eq('id',user.id).single());
  }
  State.user = prof;
  $('#login').style.display='none'; $('#app').style.display='block';
  await loadAll(); enterApp(); subscribeRealtime();
}
function enterApp(){ buildNav(); renderSidebarUser(); go(State.view||'dashboard'); window.addEventListener('resize',syncMobile); syncMobile(); refreshBell(); }
function syncMobile(){ $('#menuBtn').style.display = window.innerWidth<=900?'grid':'none'; }

/* ==================================================================
   DATA
   ================================================================== */
async function loadAll(){
  try{
    const [P,PC,B,R,N,L] = await Promise.all([
      sb.from('profiles').select('*'),
      sb.from('petty_cash').select('*').order('created_at',{ascending:false}),
      sb.from('bills').select('*').order('sort'),
      sb.from('reimbursements').select('*').order('received_date',{ascending:false}),
      sb.from('notifications').select('*').eq('recipient',State.user.id).order('created_at',{ascending:false}).limit(200),
      sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(500),
    ]);
    State.profiles = P.data||[];
    const byPc={}; (B.data||[]).forEach(b=>{(byPc[b.petty_cash_id]=byPc[b.petty_cash_id]||[]).push(b);});
    State.pcs = (PC.data||[]).map(p=>({...p, bills:byPc[p.id]||[]}));
    State.reimb = R.data||[]; State.notif = N.data||[]; State.log = L.data||[];
  }catch(e){ console.error(e); toast('Could not load data — check your Supabase setup','err'); }
}
App.reload = async () => { await loadAll(); buildNav(); refreshBell(); go(State.view); toast('Refreshed'); };

async function logAct(action, ref, detail){
  await sb.from('activity_log').insert({actor:State.user.id, action, ref:ref||'', detail:detail||''});
  State.log.unshift({actor:State.user.id, action, ref:ref||'', detail:detail||'', created_at:new Date().toISOString()});
}
async function notify(recipientIds, message, pcId, ref){
  const rows=[...new Set(recipientIds)].map(r=>({recipient:r, message, petty_cash_id:pcId||null, ref:ref||null}));
  if(rows.length) await sb.from('notifications').insert(rows);
}
function subscribeRealtime(){
  if(!sb) return;
  try{
    sb.channel('notif-'+State.user.id).on('postgres_changes',
      {event:'INSERT',schema:'public',table:'notifications',filter:`recipient=eq.${State.user.id}`},
      p=>{ State.notif.unshift(p.new); refreshBell(); toast('New notification'); }).subscribe();
  }catch(e){}
}

/* ==================================================================
   NAV
   ================================================================== */
function pendingForUser(){
  if(State.user.role==='reviewer') return State.pcs.filter(p=>p.status==='review').length;
  if(State.user.role==='approver') return State.pcs.filter(p=>p.status==='approve').length;
  return 0;
}
function buildNav(){
  const u=State.user; const pend=pendingForUser(); const items=[];
  items.push({grp:'Workspace'},{v:'dashboard',label:'Dashboard',ico:'▦'});
  if(canPrepare()) items.push({v:'create',label:'Create petty cash',ico:'＋'});
  items.push({v:'list',label:'All petty cash',ico:'≣'});
  if(u.role==='reviewer'||u.role==='approver') items.push({v:'approvals',label:'My approvals',ico:'✔',badge:pend||null});
  items.push({grp:'Management'},{v:'reimb',label:'Reimbursements',ico:'⇄'},{v:'search',label:'Advanced search',ico:'⌕'},{v:'accounts',label:'Chart of accounts',ico:'▤'},{v:'activity',label:'Activity log',ico:'◷'});
  if(u.is_admin) items.push({grp:'Admin'},{v:'users',label:'Users & rights',ico:'⚙'},{v:'admin',label:'Data controls',ico:'⛭'});
  $('#nav').innerHTML = items.map(it=> it.grp?`<div class="grp">${it.grp}</div>`:
    `<a data-v="${it.v}" onclick="App.nav('${it.v}')" class="${State.view===it.v?'active':''}"><span class="ico">${it.ico}</span>${it.label}${it.badge?`<span class="badge">${it.badge}</span>`:''}</a>`).join('');
}
function renderSidebarUser(){
  const u=State.user; const acc=canEdit()?'edit':'read';
  $('#sbUser').innerHTML = avatar(u,34)+`<div class="meta"><b>${esc((u.name||'').split(' ').slice(0,2).join(' '))}</b><span>${esc(roleLabel(u.role))}</span>
    <div><span class="access-pill ${acc}">${acc==='edit'?'Read & edit':'Read only'}</span></div></div>`;
}
function roleLabel(r){return {preparer:'Preparer',reviewer:'Check & Review',approver:'Final Approval',finance:'Finance'}[r]||r;}
App.nav = v => { if(window.innerWidth<=900) $('#sidebar').classList.remove('open'); go(v); };
function go(v){
  State.view=v; State.openId=null; buildNav();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.v===v));
  const T={dashboard:['Dashboard','Petty cash overview & management information'],create:['Create petty cash','Upload bills, capture data and assign GL accounts'],list:['All petty cash','Every petty cash and its current stage'],approvals:['My approvals','Petty cash awaiting your action'],reimb:['Reimbursements','Record float top-ups and track the balance'],search:['Advanced search','Find any bill, invoice, merchant or GL entry'],accounts:['Chart of accounts','FMO general ledger reference'],activity:['Activity log','Full audit trail of every action'],users:['Users & rights','Manage who can view and who can edit'],admin:['Data controls','Delete and clear records']};
  const t=T[v]||['','']; $('#pageTitle').textContent=t[0]; $('#pageSub').textContent=t[1];
  ({dashboard:renderDashboard,create:renderCreate,list:renderList,approvals:renderApprovals,reimb:renderReimb,search:renderSearch,accounts:renderAccounts,activity:renderActivity,users:renderUsers,admin:renderAdmin}[v]||renderDashboard)();
}

/* ==================================================================
   DASHBOARD
   ================================================================== */
function periodStats(){
  const approved=State.pcs.filter(p=>p.status==='approved');
  const spend=approved.reduce((s,p)=>s+pcTotal(p),0);
  const received=State.reimb.reduce((s,r)=>s+(Number(r.amount)||0),0);
  return {approved,spend,received,balance:received-spend,txns:approved.reduce((s,p)=>s+(p.bills||[]).length,0)};
}
function glBreakdown(){const m={};State.pcs.filter(p=>p.status==='approved').forEach(p=>(p.bills||[]).forEach(b=>{if(!b.gl_code)return;m[b.gl_code]=m[b.gl_code]||{code:b.gl_code,amt:0,cnt:0};m[b.gl_code].amt+=Number(b.amount)||0;m[b.gl_code].cnt++;}));return Object.values(m).sort((a,b)=>b.amt-a.amt);}
function merchantBreakdown(){const m={};State.pcs.filter(p=>p.status==='approved').forEach(p=>(p.bills||[]).forEach(b=>{const k=(b.merchant||'Unspecified').trim()||'Unspecified';m[k]=m[k]||{m:k,amt:0,cnt:0};m[k].amt+=Number(b.amount)||0;m[k].cnt++;}));return Object.values(m).sort((a,b)=>b.amt-a.amt);}
function monthlyBreakdown(){const m={};const add=(k,f,v)=>{m[k]=m[k]||{k,received:0,paid:0};m[k][f]+=v;};State.reimb.forEach(r=>add((r.received_date||'').slice(0,7)||'—','received',Number(r.amount)||0));State.pcs.filter(p=>p.status==='approved').forEach(p=>add((p.approved_at||p.created_at||'').slice(0,7),'paid',pcTotal(p)));return Object.values(m).sort((a,b)=>a.k<b.k?1:-1).slice(0,8);}
function renderDashboard(){
  const s=periodStats(),gl=glBreakdown(),merch=merchantBreakdown().slice(0,6),months=monthlyBreakdown();
  const pr=State.pcs.filter(p=>p.status==='review').length,pa=State.pcs.filter(p=>p.status==='approve').length,glMax=Math.max(1,...gl.map(g=>g.amt));
  $('#view').innerHTML=`
  ${State.pcs.length===0?`<div class="warn-banner">No petty cash raised yet. ${canPrepare()?'Use <b>Create petty cash</b> to begin.':'It will appear here once Ahmad Abu Taha raises one.'}</div>`:''}
  <div class="kpis">
    <div class="kpi"><span class="strip" style="background:var(--brand)"></span><div class="lbl">Petty cash balance</div><div class="val num">${aed(s.balance)}</div><div class="foot">Received ${aed(s.received)} · Settled ${aed(s.spend)}</div></div>
    <div class="kpi"><span class="strip" style="background:var(--blue)"></span><div class="lbl">Approved for settlement</div><div class="val num">${aed(s.spend)}</div><div class="foot">${s.approved.length} petty cash · ${s.txns} transactions</div></div>
    <div class="kpi"><span class="strip" style="background:var(--amber)"></span><div class="lbl">Pending review (Benin)</div><div class="val num">${pr}</div><div class="foot">Awaiting check & review</div></div>
    <div class="kpi"><span class="strip" style="background:var(--red)"></span><div class="lbl">Pending approval (Shadi)</div><div class="val num">${pa}</div><div class="foot">Awaiting final approval</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1.4fr 1fr">
    <div class="card"><div class="hd"><h3>Actual expense by GL account</h3><div class="spacer"></div><span class="sub">Approved only</span></div>
      <div class="bd">${gl.length? gl.slice(0,10).map(g=>{const a=glByCode(g.code);return `<div style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:baseline;margin-bottom:5px"><span style="font-weight:600;font-size:13px">${esc(a?a.name:g.code)}</span><span class="chip" style="padding:1px 7px;font-size:11px">${g.code}</span><div class="spacer"></div><span class="num" style="font-weight:700">${aed(g.amt)}</span><span class="sub num">· ${g.cnt}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(g.amt/glMax*100).toFixed(1)}%"></div></div></div>`;}).join(''):`<div class="empty"><div class="big">No approved spend yet</div>GL breakdown appears once petty cash is approved.</div>`}</div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="hd"><h3>Top merchants</h3></div><div class="bd" style="padding:6px 0">${merch.length?`<table><tbody>${merch.map(x=>`<tr><td>${esc(x.m)}</td><td class="right sub num">${x.cnt}×</td><td class="right num" style="font-weight:600">${aed(x.amt)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty" style="padding:26px">No data yet</div>`}</div></div>
      <div class="card"><div class="hd"><h3>Monthly received vs settled</h3></div><div class="bd" style="padding:6px 0">${months.length?`<table><thead><tr><th>Month</th><th class="right">Received</th><th class="right">Settled</th><th class="right">Net</th></tr></thead><tbody>${months.map(m=>`<tr><td>${m.k}</td><td class="right num">${fmt(m.received)}</td><td class="right num">${fmt(m.paid)}</td><td class="right num" style="font-weight:600;color:${m.received-m.paid<0?'var(--red)':'var(--green)'}">${fmt(m.received-m.paid)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty" style="padding:26px">No data yet</div>`}</div></div>
    </div>
  </div>
  <div class="card" style="margin-top:16px"><div class="hd"><h3>Recent petty cash</h3><div class="spacer"></div><button class="btn sm" onclick="App.nav('list')">View all</button></div><div class="bd" style="padding:0">${pcTable(State.pcs.slice(0,6))}</div></div>`;
}
function pcTable(list){
  if(!list.length) return `<div class="empty"><div class="big">Nothing here yet</div>Petty cash will show once created.</div>`;
  return `<table><thead><tr><th>Reference</th><th>Created</th><th>By</th><th class="right">Bills</th><th class="right">Total</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map(p=>`<tr><td><b>${esc(p.ref||'(draft)')}</b></td><td class="sub">${new Date(p.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</td><td>${esc(profById(p.created_by).name)}</td><td class="right num">${(p.bills||[]).length}</td><td class="right num" style="font-weight:600">${aed(pcTotal(p))}</td><td>${statusTag(p.status)}</td><td class="right"><button class="btn sm" onclick="App.open('${p.id}')">Open</button></td></tr>`).join('')}
  </tbody></table>`;
}

   CREATE  (Taha, edit access)
   ================================================================== */
async function renderCreate(){
  if(!canPrepare()){ $('#view').innerHTML=`<div class="empty"><div class="big">Preparation is Ahmad Abu Taha's step</div>You need preparer role with edit access.</div>`; return; }
  if(!State.draft){
    let mine=State.pcs.find(p=>p.status==='draft'&&p.created_by===State.user.id&&(p.bills||[]).length===0);
    if(!mine){ const {data,error}=await sb.from('petty_cash').insert({status:'draft',created_by:State.user.id}).select().single();
      if(error){toast('Could not start draft','err');return;} data.bills=[]; State.pcs.unshift(data); mine=data; }
    State.draft=mine;
  }
  drawCreate();
}
function drawCreate(){

  $('#view').innerHTML=`
  <div class="card" style="margin-bottom:16px"><div class="bd" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <div><div class="sub">Reference</div><div style="font-weight:700;font-size:15px">${d.ref?esc(d.ref):'<span class="sub" style="font-weight:500">Generated on finalisation</span>'}</div></div>
    <div style="width:1px;height:34px;background:var(--line-2)"></div>
    <div><div class="sub">Created</div><div style="font-weight:600">${dstr(d.created_at)}</div></div>
    <div style="width:1px;height:34px;background:var(--line-2)"></div>
    <div><div class="sub">Prepared by</div><div style="font-weight:600">${esc(State.user.name)}</div></div>
    <div class="spacer"></div><div style="text-align:right"><div class="sub">Bills · Total</div><div style="font-weight:800;font-size:18px" class="num">${(d.bills||[]).length} · ${aed(total)}</div></div>
  </div></div>
  ${dup?`<div class="warn-banner" style="background:var(--red-bg);border-color:#e6b3ae;color:#7a2a2a">⚠ ${dup} possible duplicate ${dup>1?'bills':'bill'} detected and highlighted below.</div>`:''}
  <div class="card" style="margin-bottom:16px"><div class="hd"><h3>1 · Upload bills & invoices</h3><div class="spacer"></div><span class="sub">Images or PDF · one-by-one or bulk</span></div>
    <div class="bd"><div class="dropzone" id="dz" onclick="document.getElementById('fileInp').click()"><div style="font-size:26px">⇪</div><div class="big">Drop bills here or click to browse</div><div class="small">JPG, PNG or PDF. Files go straight to shared cloud storage and are read automatically.</div></div>
    <input type="file" id="fileInp" multiple accept="image/*,application/pdf" style="display:none" onchange="App.filesPicked(this.files)"></div></div>
  <div class="card"><div class="hd"><h3>2 · Captured lines</h3><div class="spacer"></div><span class="sub">Edit any field, then assign the reason / GL account</span></div>
    <div class="bd" id="billsBox">${(d.bills||[]).length? d.bills.map(billRow).join('') : `<div class="empty"><div class="big">No bills uploaded yet</div>Upload bills above to begin capturing.</div>`}</div></div>
  <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
    <div class="spacer"></div>
    <button class="btn ghost danger" onclick="App.discardDraft()">Discard</button>
    <button class="btn primary" onclick="App.finalise()" ${(d.bills||[]).length===0?'disabled':''}>Finalise & send for review →</button>
  </div>`;
  wireDropzone();
}
function billRow(b){
  const glOpts=`<option value="">— Select reason / GL —</option>`+GL.map(g=>`<option value="${g.code}" ${b.gl_code===g.code?'selected':''}>${g.cat} · ${g.name} (${g.code})</option>`).join('');
  const thumb=b._thumb?`<img src="${b._thumb}">`:`<div class="ph">${(b.mime||'').includes('pdf')?'PDF':'FILE'}</div>`;
  return `<div class="bill ${b.is_duplicate?'dup':''}" data-b="${b.id}">
    <div class="thumb">${thumb}</div>
    <div><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-weight:600;font-size:13px">${esc(b.file_name||'bill')}</span>${b.is_duplicate?'<span class="tag dup">Possible duplicate</span>':''}<div class="spacer"></div><div class="st" id="st-${b.id}">${b._analyzing?'<span class="spin"></span> Reading…':(b._analyzed?'<span style="color:var(--green)">✓ Auto-captured</span>':'Manual entry')}</div><button class="btn ghost sm danger" onclick="App.removeBill('${b.id}')">Remove</button></div>
    <div class="fields">

function wireDropzone(){const dz=$('#dz');if(!dz)return;['dragover','dragenter'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('drag');}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('drag');}));dz.addEventListener('drop',ev=>{if(ev.dataTransfer.files.length)App.filesPicked(ev.dataTransfer.files);});}

App.filesPicked = async files => {
  for(const f of files){
    const billId = (crypto.randomUUID? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
    const path = `${State.draft.id}/${billId}_${f.name.replace(/[^\w.\-]/g,'_')}`;
    let uploaded=true;
    try{ const {error}=await sb.storage.from(CONFIG.BILLS_BUCKET).upload(path,f,{upsert:true,contentType:f.type}); if(error) throw error; }
    catch(e){ uploaded=false; toast('Upload failed for '+f.name,'err'); }
    const rec={id:billId,petty_cash_id:State.draft.id,file_name:f.name,mime:f.type,file_path:uploaded?path:null,bill_date:'',merchant:'',invoice:'',amount:null,gl_code:'',remark:'',is_duplicate:false,sort:(State.draft.bills||[]).length};
    await sb.from('bills').insert(rec);
    rec._thumb = f.type.startsWith('image/')? await thumb(f):null;
    rec._analyzing=true;
    State.draft.bills.push(rec); drawCreate();
    analyzeBill(rec,f).finally(async()=>{ await checkDuplicate(rec); await sb.from('bills').update({bill_date:rec.bill_date,merchant:rec.merchant,invoice:rec.invoice,amount:rec.amount,is_duplicate:rec.is_duplicate}).eq('id',rec.id); drawCreate(); });
  }
};
function thumb(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height;const s=Math.min(1,300/Math.max(w,h));w*=s;h*=s;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',0.7));};i.onerror=()=>res(null);i.src=r.result;};r.onerror=()=>res(null);r.readAsDataURL(f);});}
function toBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}

async function analyzeBill(rec,file){
  const isImg=(rec.mime||'').startsWith('image/'),isPdf=(rec.mime||'').includes('pdf');
  if(!isImg&&!isPdf){ rec._analyzing=false; if(!rec.bill_date) rec.bill_date=todayISO(); return; }
  try{
    const b64=await toBase64(file); let j=null;
    if(CONFIG.EDGE_ANALYZE_URL){
      const {data:{session}}=await sb.auth.getSession();
      const r=await fetch(CONFIG.EDGE_ANALYZE_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+((session&&session.access_token)||'')},body:JSON.stringify({fileBase64:b64,mime:rec.mime})});
      j=await r.json();
    } else if(CONFIG.ANTHROPIC_API_KEY){
      const block=isPdf?{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}:{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}};
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':CONFIG.ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[block,{type:'text',text:'Extract and reply ONLY JSON {"date":"YYYY-MM-DD","merchant":"","invoice":"","amount":0}. amount=final total number only.'}]}]})});
      const d=await r.json(); const t=(d.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n'); j=JSON.parse(t.replace(/```json|```/g,'').trim());
    } else { rec._analyzing=false; if(!rec.bill_date) rec.bill_date=todayISO(); return; }
    if(j&&!j.error){
      if(j.date&&/^\d{4}-\d{2}-\d{2}$/.test(j.date)) rec.bill_date=j.date; else if(!rec.bill_date) rec.bill_date=todayISO();
      rec.merchant=j.merchant||rec.merchant||''; rec.invoice=j.invoice||rec.invoice||'';
      if(j.amount!=null&&!isNaN(j.amount)) rec.amount=Number(j.amount);
      rec._analyzed=true;
    } else if(!rec.bill_date) rec.bill_date=todayISO();
  }catch(e){ console.warn('analyze',e); if(!rec.bill_date) rec.bill_date=todayISO(); }
  finally{ rec._analyzing=false; }
}
async function checkDuplicate(rec){
  const key=(inv,amt)=>((inv||'').trim().toLowerCase())+'|'+(Number(amt)||0).toFixed(2);
  if(!rec.invoice){ rec.is_duplicate=false; return; }
  const mine=key(rec.invoice,rec.amount); let dup=false;
  State.pcs.forEach(p=>(p.bills||[]).forEach(o=>{ if(o.id!==rec.id && key(o.invoice,o.amount)===mine) dup=true; }));
  rec.is_duplicate=dup; if(dup) toast('Possible duplicate: '+(rec.file_name||'bill'),'err');
}
App.editBill = async (id,f,v)=>{ const b=State.draft.bills.find(x=>x.id===id); if(!b)return; b[f]=f==='amount'?(v===''?null:Number(v)):v;
  if(f==='invoice'||f==='amount') await checkDuplicate(b);
  await sb.from('bills').update({[f]:b[f],is_duplicate:b.is_duplicate}).eq('id',id); drawCreate(); };
App.removeBill = async id => { const b=State.draft.bills.find(x=>x.id===id); if(b&&b.file_path){ try{await sb.storage.from(CONFIG.BILLS_BUCKET).remove([b.file_path]);}catch(e){} } await sb.from('bills').delete().eq('id',id); State.draft.bills=State.draft.bills.filter(x=>x.id!==id); drawCreate(); };
App.discardDraft = async () => { const d=State.draft; for(const b of (d.bills||[])){ if(b.file_path){try{await sb.storage.from(CONFIG.BILLS_BUCKET).remove([b.file_path]);}catch(e){}} } await sb.from('petty_cash').delete().eq('id',d.id); State.pcs=State.pcs.filter(p=>p.id!==d.id); State.draft=null; toast('Draft discarded'); go('list'); };
App.finalise = async () => {
  const d=State.draft; const noGl=(d.bills||[]).filter(b=>!b.gl_code).length, noAmt=(d.bills||[]).filter(b=>!b.amount).length;
  if(noGl){toast(`${noGl} bill(s) have no GL account`,'err');return;} if(noAmt){toast(`${noAmt} bill(s) have no amount`,'err');return;}
  const dup=(d.bills||[]).filter(b=>b.is_duplicate).length;
  const run=async()=>{
    const {data:ref}=await sb.rpc('assign_ref',{pc:d.id});
    await sb.from('petty_cash').update({status:'review',finalised_at:new Date().toISOString(),ref}).eq('id',d.id);
    d.ref=ref; d.status='review'; d.finalised_at=new Date().toISOString();
    await logAct('Finalised petty cash',ref,`${d.bills.length} bill(s) · ${aed(pcTotal(d))}`);
    await notify(idsByRole('reviewer'),`${State.user.name} finalised petty cash ${ref} (${aed(pcTotal(d))}). Ready for your check & review.`,d.id,ref);
    State.draft=null; closeModal(); toast('Finalised — Benin notified','ok'); await loadAll(); buildNav(); go('list');
  };
  if(dup) confirmModal('Duplicates present',`${dup} possible duplicate bill(s) are still flagged. Finalise anyway?`,'Finalise anyway',run); else run();
};

   ================================================================== */
function renderSearch(){ $('#view').innerHTML=`<div class="card"><div class="bd"><div class="row" style="align-items:end"><div class="field" style="margin:0"><label>Search bills, merchants, invoices, remarks, references</label><input id="q" class="input" placeholder="Type to search…" oninput="App.runSearch()"></div><div class="field" style="margin:0;max-width:260px"><label>GL account</label><select id="qgl" class="input" onchange="App.runSearch()"><option value="">All GL accounts</option>${GL.map(g=>`<option value="${g.code}">${g.name} (${g.code})</option>`).join('')}</select></div></div></div></div><div class="card" style="margin-top:14px"><div class="bd" style="padding:0" id="searchRes"></div></div>`; App.runSearch(); }
App.runSearch = () => { const q=($('#q').value||'').toLowerCase().trim(),gl=$('#qgl').value,rows=[]; State.pcs.forEach(p=>(p.bills||[]).forEach(b=>{ if(gl&&b.gl_code!==gl)return; const hay=[p.ref,b.merchant,b.invoice,b.remark,b.bill_date,glByCode(b.gl_code)?glByCode(b.gl_code).name:'',String(b.amount)].join(' ').toLowerCase(); if(q&&!hay.includes(q))return; rows.push({p,b}); })); const hi=t=>{t=esc(t||'');if(!q)return t;return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<span class="hl">$1</span>');}; $('#searchRes').innerHTML=rows.length?`<table><thead><tr><th>Reference</th><th>Date</th><th>Merchant</th><th>Invoice</th><th>GL</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows.slice(0,300).map(({p,b})=>{const g=glByCode(b.gl_code);return `<tr><td><b>${hi(p.ref)}</b></td><td class="num">${hi(b.bill_date)}</td><td>${hi(b.merchant)}</td><td class="sub">${hi(b.invoice)}</td><td class="sub">${g?hi(g.name):'—'}</td><td class="right num" style="font-weight:600">${aed(b.amount)}</td><td>${statusTag(p.status)}</td><td class="right"><button class="btn sm" onclick="App.open('${p.id}')">Open</button></td></tr>`;}).join('')}</tbody></table>`:`<div class="empty"><div class="big">No matches</div>Try a different term, merchant or GL account.</div>`; };
function renderAccounts(){ const cats=[...new Set(GL.map(g=>g.cat))]; $('#view').innerHTML=`<div class="card"><div class="hd"><h3>FM Operations · Chart of accounts</h3><div class="spacer"></div><span class="sub">${GL.length} GL accounts · parent 51500000</span></div><div class="bd" style="padding:0"><table><thead><tr><th>Category</th><th>GL code</th><th>Account name</th></tr></thead><tbody>${cats.map(c=>{const rows=GL.filter(g=>g.cat===c);return rows.map((g,i)=>`<tr>${i===0?`<td rowspan="${rows.length}" style="font-weight:600;vertical-align:top;background:#fafbfa">${esc(c)}</td>`:''}<td class="num" style="font-weight:600">${g.code}</td><td>${esc(g.name)}</td></tr>`).join('');}).join('')}</tbody></table></div></div>`; }
function renderActivity(){ $('#view').innerHTML=`<div class="card"><div class="hd"><h3>Activity log</h3><div class="spacer"></div><span class="sub">${State.log.length} entries</span></div><div class="bd" style="padding:0">${State.log.length?`<table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Reference</th><th>Detail</th></tr></thead><tbody>${State.log.map(l=>`<tr><td class="sub num">${dstr(l.created_at)}</td><td>${esc(profById(l.actor).name)}</td><td style="font-weight:600">${esc(l.action)}</td><td class="num">${esc(l.ref||'')}</td><td class="sub">${esc(l.detail||'')}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><div class="big">No activity yet</div>Actions across the system are recorded here.</div>`}</div></div>`; }

/* ==================================================================
   USERS & RIGHTS  (admin)
   ================================================================== */
function renderUsers(){
  if(!isAdmin()){ $('#view').innerHTML=`<div class="empty"><div class="big">Admin access required</div>Only admins can manage rights.</div>`; return; }
  $('#view').innerHTML=`<div class="warn-banner">Set each person's access level. <b>Read only</b> can view everything but cannot create, edit or approve. <b>Read & edit</b> can act on their role. Changes apply immediately (they may need to refresh).</div>
  <div class="card"><div class="hd"><h3>Users</h3><div class="spacer"></div><span class="sub">${State.profiles.length} accounts</span></div>
  <div class="bd" style="padding:0"><table><thead><tr><th>User</th><th>Role</th><th>Access level</th><th>Admin</th></tr></thead><tbody>
    ${State.profiles.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<tr>
      <td><div style="display:flex;align-items:center;gap:10px">${avatar(p,32)}<div><b>${esc(p.name)}</b><div class="sub" style="font-size:11.5px">${esc(p.email)}</div></div></div></td>
      <td><select class="input" style="padding:6px 9px;min-width:130px" onchange="App.setUser('${p.id}','role',this.value)">${['preparer','reviewer','approver','finance'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${roleLabel(r)}</option>`).join('')}</select></td>
      <td><div class="seg"><button class="${p.access==='read'?'on':''}" onclick="App.setUser('${p.id}','access','read')">Read only</button><button class="${p.access==='edit'?'on':''}" onclick="App.setUser('${p.id}','access','edit')">Read & edit</button></div></td>
      <td><input type="checkbox" ${p.is_admin?'checked':''} onchange="App.setUser('${p.id}','is_admin',this.checked)" style="width:18px;height:18px"></td>
    </tr>`).join('')}
  </tbody></table></div></div>`;
}
App.setUser = async (id,field,value) => {
  const {error}=await sb.from('profiles').update({[field]:value}).eq('id',id);
  if(error){toast('Update failed — '+error.message,'err');return;}
  const p=State.profiles.find(x=>x.id===id); if(p)p[field]=value;
  if(id===State.user.id){ State.user[field]=value; renderSidebarUser(); buildNav(); }
  await logAct('Changed user rights', '', `${profById(id).name}: ${field} → ${value}`);
  toast('Updated','ok'); renderUsers();
};

/* ==================================================================
   DATA CONTROLS (admin)
   ================================================================== */
function renderAdmin(){
  if(!isAdmin()){ $('#view').innerHTML=`<div class="empty"><div class="big">Admin access required</div></div>`; return; }
  $('#view').innerHTML=`<div class="warn-banner">Admin actions are irreversible and are written to the activity log.</div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><div class="hd"><h3>Petty cash records</h3></div><div class="bd" style="padding:0">${State.pcs.length?`<table><thead><tr><th>Reference</th><th>Status</th><th class="right">Total</th><th></th></tr></thead><tbody>${State.pcs.map(p=>`<tr><td><b>${esc(p.ref||'(draft)')}</b></td><td>${statusTag(p.status)}</td><td class="right num">${aed(pcTotal(p))}</td><td class="right"><button class="btn ghost sm" onclick="App.open('${p.id}')">Open</button><button class="btn ghost sm danger" onclick="App.adminDelete('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty" style="padding:26px">No records</div>`}</div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="hd"><h3>Bulk data</h3></div><div class="bd"><p class="info-line" style="margin-top:0">Remove all petty cash, bills, reimbursements, notifications and the activity log. Users and the chart of accounts are kept.</p><button class="btn danger block" onclick="App.clearAll()">Clear all data</button></div></div>
      <div class="card"><div class="hd"><h3>Cloud</h3></div><div class="bd"><p class="info-line" style="margin:0">Backend: <b>Supabase</b> · shared across all users. Petty cash ${State.pcs.length} · Reimbursements ${State.reimb.length} · Log ${State.log.length}.</p></div></div>
    </div></div>`;
}
App.adminDelete = id => { const pc=State.pcs.find(p=>p.id===id); if(!pc)return; confirmModal('Delete petty cash',`Permanently delete <b>${esc(pc.ref||'this draft')}</b> and its ${(pc.bills||[]).length} bill(s)?`,'Delete', async ()=>{ for(const b of (pc.bills||[])){ if(b.file_path){try{await sb.storage.from(CONFIG.BILLS_BUCKET).remove([b.file_path]);}catch(e){}} } await sb.from('petty_cash').delete().eq('id',id); State.pcs=State.pcs.filter(p=>p.id!==id); await logAct('Deleted petty cash',pc.ref||''); closeModal(); toast('Deleted'); go(State.view==='admin'?'admin':'list'); }); };
App.clearAll = () => { confirmModal('Clear all data','This removes every petty cash, bill, reimbursement, notification and log entry across the cloud. It cannot be undone.','Clear everything', async ()=>{
  await sb.from('bills').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await sb.from('petty_cash').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await sb.from('reimbursements').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await sb.from('notifications').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await sb.from('activity_log').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await loadAll(); closeModal(); toast('All data cleared'); go('dashboard'); buildNav(); refreshBell(); }); };

/* ==================================================================
   NOTIFICATIONS + MODALS
   ================================================================== */
const unreadCount = () => State.notif.filter(n=>!n.is_read).length;
function refreshBell(){ $('#bellDot').style.display=unreadCount()?'block':'none'; }
App.toggleNotif = () => { const p=$('#notifPanel'),o=p.classList.toggle('open'); $('#overlay').classList.toggle('show',o); if(o)renderNotifs(); };
App.closePanels = () => { $('#notifPanel').classList.remove('open'); $('#overlay').classList.remove('show'); };
function renderNotifs(){ $('#notifList').innerHTML=State.notif.length?State.notif.map(n=>`<div class="notif ${n.is_read?'':'unread'}"><div class="nm">${esc(n.message)}</div><div class="nt"><span>${timeAgo(n.created_at)}</span>${n.petty_cash_id?`<button class="btn ghost sm" style="margin-left:auto;padding:3px 9px" onclick="App.openFromNotif('${n.id}','${n.petty_cash_id}')">Open</button>`:''}</div></div>`).join(''):`<div class="empty"><div class="big">No notifications</div>You're all caught up.</div>`; }
App.openFromNotif = async (nid,pcId) => { const n=State.notif.find(x=>x.id===nid); if(n&&!n.is_read){ n.is_read=true; await sb.from('notifications').update({is_read:true}).eq('id',nid); refreshBell(); } App.closePanels(); App.open(pcId); };
App.markAllRead = async () => { const ids=State.notif.filter(n=>!n.is_read).map(n=>n.id); if(ids.length) await sb.from('notifications').update({is_read:true}).in('id',ids); State.notif.forEach(n=>n.is_read=true); refreshBell(); renderNotifs(); };
function closeModal(){ $('#modalWrap').classList.remove('show'); } App.closeModal=closeModal;
function confirmModal(title,html,ok,onOk){ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=`<p style="margin:0;line-height:1.55">${html}</p>`; $('#modalFoot').innerHTML=`<button class="btn" onclick="App.closeModal()">Cancel</button><button class="btn danger" id="okBtn">${esc(ok)}</button>`; $('#modalWrap').classList.add('show'); $('#okBtn').onclick=onOk; }
function promptModal(title,label,ph,onOk){ $('#modalTitle').textContent=title; $('#modalBody').innerHTML=`<div class="field" style="margin:0"><label>${esc(label)}</label><textarea id="pmInp" class="input" placeholder="${esc(ph)}"></textarea></div>`; $('#modalFoot').innerHTML=`<button class="btn" onclick="App.closeModal()">Cancel</button><button class="btn primary" id="pmOk">Submit</button>`; $('#modalWrap').classList.add('show'); $('#pmOk').onclick=()=>{const v=$('#pmInp').value.trim();closeModal();onOk(v);}; }

/* ---------- start ---------- */
initAuth();
</script>
</body>
</html>
